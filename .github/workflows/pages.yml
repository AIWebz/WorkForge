name: Deploy WorkForge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh extension file list (used by the in-browser ZIP builder)
        run: |
          cd extension
          find . -type f ! -name files.json | sed 's|^\./||' | sort | jq -R . | jq -s '{files: .}' > files.json
      - name: Self-host the AI engine's model (optional)
        # Set the repository variable WORKFORGE_MODEL (Settings → Secrets and variables → Actions → Variables),
        # e.g. Qwen2.5-1.5B-Instruct-q4f16_1-MLC. GitHub Pages sites are limited to about 1 GB.
        if: ${{ vars.WORKFORGE_MODEL != '' }}
        run: node .github/scripts/fetch-model.mjs "${{ vars.WORKFORGE_MODEL }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
